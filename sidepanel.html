<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>LocalBrowserAI — Side Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sidepanel-body">

  <!-- ── Header ── -->
  <div class="header">
    <button id="historyBtn" class="icon-btn" title="History">H</button>
    <span class="title">LocalBrowserAI</span>
    <div class="header-right">
      <button id="themeToggle" class="icon-btn" title="Toggle dark/light mode">☾</button>
      <button id="closePanelBtn" class="icon-btn" title="Close side panel">✕</button>
    </div>
  </div>

  <!-- ── Backend Warning ── -->
  <div id="backendWarning" class="backend-warning" style="display:none">
    <span>⚠️ Backend not running</span>
    <button id="startBackendBtn">Start Server</button>
  </div>

  <!-- ── Query ── -->
  <div class="query-area">
    <label for="prompt">Ask about this page:</label>
    <textarea id="prompt" placeholder="e.g., What is this graph showing?"></textarea>
    <div class="query-actions">
      <button id="modeToggle" class="mode-btn" title="Screenshot mode — captures visible page">📷</button>
      <button id="sendButton" class="send-btn">📸 Take Screenshot &amp; Ask</button>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="response" class="response-area"></div>

  <!-- ── History Modal ── -->
  <div id="historyModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>History</h3>
        <div class="modal-header-actions">
          <button id="clearHistoryBtn" class="icon-btn" title="Clear all"
                  style="font-size:11px;width:auto;padding:0 8px">Clear</button>
          <button id="closeHistory" class="icon-btn" title="Close">✕</button>
        </div>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
